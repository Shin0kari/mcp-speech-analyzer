[package]
name = "speech-analyzer-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
